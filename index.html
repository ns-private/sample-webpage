<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sample-webpage</title>
    <meta name="description" content="A simple public sample web page." />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .hero {
        width: min(100%, 720px);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 48px 32px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.1;
      }
      p {
        margin: 0 auto;
        max-width: 52ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .actions {
        margin-top: 28px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 140px;
        padding: 12px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }
      a.button:hover { transform: translateY(-1px); }
      .primary { background: var(--accent); color: white; }
      .primary:hover { background: var(--accent-hover); }
      .secondary { border: 1px solid var(--border); color: var(--text); background: var(--card); }
      footer {
        margin-top: 28px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      @media (max-width: 640px) {
        .hero { padding: 36px 22px; border-radius: 20px; }
        .actions { flex-direction: column; }
        a.button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <span class="badge">Public Sample Page</span>
      <h1>Welcome to sample-webpage</h1>
      <p>
        これは公開用の最小サンプルWebページです。シンプルな構成で、
        そのまま静的ホスティングに載せられます。
      </p>
      <div class="actions">
        <a class="button primary" href="#about">詳しく見る</a>
        <a class="button secondary" href="https://github.com/ns-private/sample-webpage" target="_blank" rel="noreferrer">GitHubを見る</a>
      </div>
      <footer id="about">HTML と CSS だけで作られた、最小構成のトップページです。</footer>
    </main>
  </body>
</html>
